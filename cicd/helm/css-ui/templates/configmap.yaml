apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "css-ui.fullname" . }}-config
  labels:
    {{- include "css-ui.labels" . | nindent 4 }}
data:
  # Environment configuration
  {{- range .Values.env }}
  {{ .name }}: "{{ .value }}"
  {{- end }}
  ENVIRONMENT: "{{ .Values.environment }}"
  PROFILE: "{{ .Values.profile | default .Values.environment }}"

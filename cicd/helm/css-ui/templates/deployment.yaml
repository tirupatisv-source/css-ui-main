{{- $host := printf "%s-%s" "css-ui" (.Values.profile | default .Values.environment) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "css-ui.fullname" . }}
  labels:
    {{- include "css-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "css-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "css-ui.selectorLabels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: "{{ .Values.imagePullSecrets }}"
      serviceAccountName: {{ include "css-ui.serviceAccountName" . }}
      
      # Security context
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      
      # Container configuration
      containers:
      - name: {{ $host }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        
        env:
        - name: ENVIRONMENT
          value: {{ .Values.environment | quote }}
        - name: PROFILE
          value: {{ .Values.profile | default .Values.environment | quote }}
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        
        # Liveness probe
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        
        # Readiness probe
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        
        # Resource limits
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        
        # Security context for container
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

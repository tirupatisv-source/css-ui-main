# Production overrides for css-ui Helm chart

environment: prod
domain: rke-odc-prod.corp.intranet
profile: production

replicaCount: 1

image:
  name: css-ui
  repository: nexusprod.corp.intranet:4567/css/css-ui
  tag: prod-260520114120
  pullPolicy: Always

imagePullSecrets: nexus-reg-secret

ingress:
  enabled: true
  ingressClass: nginx
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
  hosts:
    - hostName: css-ui
      paths: [/]

resources:
  limits:
    memory: 2048Mi
    cpu: 1000m
  requests:
    memory: 1024Mi
    cpu: 500m

# Environment variables for production
# NOTE: API_ENDPOINT and AUTH_ENDPOINT are PLACEHOLDERS
# UPDATE THESE ONCE YOUR BACKEND SERVICES ARE DEPLOYED TO PROD RANCHER
#
# Example after deployment:
#   API_ENDPOINT: "http://api-service.css-prod.svc.cluster.local:8080"
#   AUTH_ENDPOINT: "http://auth-service.css-prod.svc.cluster.local:3001"
env:
  - name: NODE_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "info"
  - name: API_ENDPOINT
    value: "https://api.prod.corp.intranet:8443"  # TODO: UPDATE when API service is deployed to prod
  - name: AUTH_ENDPOINT
    value: "https://auth.prod.corp.intranet:8443"  # TODO: UPDATE when Auth service is deployed to prod

# Probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 45
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3

# Default values for css-ui Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Environment configuration
environment: dev
domain: rke-odc-test.corp.intranet
profile: development

replicaCount: 1

image:
  name: css-ui
  repository: nexusprod.corp.intranet:4567/css/css-ui
  tag: dev-260520114120
  pullPolicy: Always

imagePullSecrets: nexus-reg-secret

ingress:
  enabled: true
  ingressClass: nginx
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
  hosts:
    - hostName: css-ui
      paths: [/]

resources:
  limits:
    memory: 2048Mi
    cpu: 2000m
  requests:
    memory: 2048Mi
    cpu: 2000m

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: css-ui-sa

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Environment variables
# NOTE: API_ENDPOINT and AUTH_ENDPOINT are PLACEHOLDERS
# UPDATE THESE ONCE YOUR BACKEND SERVICES ARE DEPLOYED TO RANCHER
# 
# Backend service endpoint formats:
# - Same namespace (Internal): http://service-name.namespace.svc.cluster.local:PORT
# - Via Rancher Ingress (External): http://service-name-dev.rke-odc-test.corp.intranet
#
# Example after deployment:
#   API_ENDPOINT: "http://api-service.css-dev.svc.cluster.local:8080"
#   AUTH_ENDPOINT: "http://auth-service.css-dev.svc.cluster.local:3001"
env:
  - name: NODE_ENV
    value: "development"
  - name: LOG_LEVEL
    value: "debug"
  - name: API_ENDPOINT
    value: "http://api.dev.local:3000"  # TODO: UPDATE when API service is deployed
  - name: AUTH_ENDPOINT
    value: "http://auth.dev.local:3001"  # TODO: UPDATE when Auth service is deployed


# Probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
affinity: {}
tolerations: {}


apiVersion: apps/v1
kind: Deployment
metadata:
  name: css-ui
  namespace: css-ui
  labels:
    app: css-ui
    version: v1
spec:
  replicas: KUBERNETES_REPLICAS
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: css-ui
  template:
    metadata:
      labels:
        app: css-ui
        version: v1
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Service account for RBAC
      serviceAccountName: css-ui-sa
      
      # Container configuration
      containers:
      - name: css-ui
        image: DOCKER_REGISTRY/css-ui:IMAGE_TAG
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: css-ui-config
        
        # Additional environment variables
        env:
        - name: APP_PROFILE
          value: "APP_PROFILE"
        
        # Resource requests and limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      
      # Pod security context
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Image pull secrets (if using private registry)
      # imagePullSecrets:
      # - name: docker-registry-secret
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      
      # Pod disruption budget and node affinity
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - css-ui
              topologyKey: kubernetes.io/hostname

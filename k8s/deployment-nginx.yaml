apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: css-dev
data:
  nginx.conf: |
    # Nginx configuration served from ConfigMap
    # This file is automatically loaded by the Nginx pod
    
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 100M;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript 
                   application/json application/javascript application/xml+rss 
                   application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
        gzip_disable "msie6";

        # Rate limiting zones
        limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
        limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

        # Upstream backend (Kubernetes service DNS)
        upstream spring_boot_backend {
            server css-services:8080;
            keepalive 32;
        }

        server {
            listen 80;
            server_name _;

            # Security Headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

            # CSP Header
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://login.microsoftonline.com https://*.microsoftonline.com;" always;

            root /usr/share/nginx/html;

            # Static assets with long cache
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable" always;
                try_files $uri =404;
            }

            # API proxy to Spring Boot
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://spring_boot_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }

            # Health checks
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # Angular SPA routing
            location / {
                limit_req zone=general burst=50 nodelay;
                try_files $uri $uri/ /index.html;
                expires -1;
                add_header Cache-Control "public, must-revalidate" always;
            }

            # Deny hidden files
            location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: css-ui
  namespace: css-dev
  labels:
    app: css-ui
    component: frontend
    environment: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: css-ui
  template:
    metadata:
      labels:
        app: css-ui
        component: frontend
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Pod security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101

      containers:
      - name: css-ui
        image: nexusprod.corp.intranet:4567/css/css-ui:dev-latest
        imagePullPolicy: Always
        
        # Container security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
            - ALL
        
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        
        # Environment variables
        env:
        - name: NGINX_WORKER_PROCESSES
          value: "4"
        
        # Resource limits
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Volume mounts
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-logs
          mountPath: /var/log/nginx
      
      # Image pull secrets
      imagePullSecrets:
      - name: nexus-registry-credentials
      
      # Volumes
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: nginx-cache
        emptyDir:
          sizeLimit: 1Gi
      - name: nginx-logs
        emptyDir:
          sizeLimit: 500Mi

---
apiVersion: v1
kind: Service
metadata:
  name: css-ui
  namespace: css-dev
  labels:
    app: css-ui
    component: frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: css-ui

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: css-ui-network-policy
  namespace: css-dev
spec:
  podSelector:
    matchLabels:
      app: css-ui
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: css-dev
    ports:
    - protocol: TCP
      port: 80
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # Allow backend communication
  - to:
    - podSelector:
        matchLabels:
          app: css-services
    ports:
    - protocol: TCP
      port: 8080
  # Allow outbound HTTPS (for Microsoft login, fonts, etc.)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: css-ui-pdb
  namespace: css-dev
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: css-ui

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: css-ui-hpa
  namespace: css-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: css-ui
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
